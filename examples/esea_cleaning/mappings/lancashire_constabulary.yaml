force_id: lancashire_constabulary
display_name: Lancashire Constabulary

# Wave-4 (2025) PDF — pdfplumber cannot resolve tables, but the text layer is
# regular: each ethnicity row ends with 72 whitespace-separated numeric tokens
# (12 months × 5 years + 6 months for 2025 + 6 annual totals).
# We use the new `pdf_text_values_per_row` loader mode to parse the text flow.
# Page 1 = Crimes (what we use for fct_crime_aggs__v2); page 0 = Incidents.
# Data covers Jan 2020 – Jun 2025 on pages 1-2. Annual-total columns are
# unnamed after rename and therefore ignored by wide_months' Mmm-YY pattern.
# Some labels wrap mid-word across lines (e.g. "Any Other Asian Backgroun d")
# — mapped literally below.
source_file: "Hate crime incidents FOI2025 02114.pdf"

extraction:
  pdf_text_page: [1, 2]
  pdf_text_values_per_row: 72
  pdf_text_skip_before_label: "African"
