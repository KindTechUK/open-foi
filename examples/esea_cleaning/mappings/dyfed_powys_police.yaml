force_id: dyfed_powys_police
display_name: Dyfed Powys Police

source_file: "Response Doc.docx"

# Dyfed Powys submitted TWO incompatible ethnicity taxonomies:
#   Table 1: 2020–May 2023 using coarse categories (ASIAN, BLACK, etc.)
#   Table 2: May 2023 onwards using detailed UK police codes (A1–W9)
# We use Table 2 for the higher-resolution view. This loses coarse data for
# 2020–early 2023; that earlier window could be added later using a separate
# entry (different force_id suffix) if coarse-granularity history is needed.
# Note: the Table 2 column "2023 (12/05/2025 onwards)" contains an obvious
# year-number typo in the source (should read "12/05/2023 onwards"). We map
# it to 2023 to match the force's evident intent.
extraction:
  table_index: 2
  header: 0
  shape: wide_years
  columns:
    ethnicity: "Victim Ethnicity"
  year_columns:
    "2023 (12/05/2025 onwards)": 2023
    "2024": 2024
    "2025": 2025
  skip_ethnicities:
    - "Grand Total"

mapping:
  "A1. Asian Indian inc Asian British": "Asian - Indian"
  "A2. Asian Pakistani inc Asian British": "Asian - Pakistani"
  "A3. Asian Bangladeshi inc Asian British": "Asian - Bangladeshi"
  "A4. Asian Chinese inc Asian British": "Asian - Chinese"
  "A9. Any other Asian background": "Asian - Other"
  "B1. Black Caribbean inc Black British": "Black - Caribbean"
  "B2. Black African inc Black British": "Black - African"
  "B9. Any other Black background": "Black - Other"
  "M1. Mixed White & Black Caribbean": "Mixed - White and Black Caribbean"
  "M2. Mixed White & Black African": "Mixed - White and Black African"
  "M3. Mixed White & Asian": "Mixed - White and Asian"
  "M9. Any other mixed": "Mixed - Other"
  "O2. Arab": "Other - Arab"
  "O9. Any other": "Other - Any other ethnic group"
  "W1. White British": "White - English/Welsh/Scottish/Northern Irish/British"
  "W2. White Irish": "White - Irish"
  "W3. White Gypsy or Irish Traveller": "White - Gypsy or Irish Traveller"
  "W9. Any other white background": "White - Other"
  "NS. Not stated": "Not stated / Unknown"
