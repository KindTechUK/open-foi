force_id: gloucestershire_constabulary
display_name: Gloucestershire Constabulary

# No Wave-4 response. Wave-2 (2022) XLSX is a compact wide_months layout
# with a year-header row above a month-header row (Jan Feb ... Dec ×
# 2019/2020/2021 + Jan Feb Mar 2022). 3 ethnicity rows + Total.
# Read headerless, rename positional columns to Mmm-YY so wide_months' default
# pattern (`^[A-Z][a-z]{2}-\d{2}$`) picks them up, and drop the stub rows.
source_file: "2022/FOI Data 2022.0383.xlsx"

extraction:
  header: null
  drop_row_indices: [0, 1, 2, 6]
  rename_columns:
    0: "Ethnicity"
    1: "Jan-19"
    2: "Feb-19"
    3: "Mar-19"
    4: "Apr-19"
    5: "May-19"
    6: "Jun-19"
    7: "Jul-19"
