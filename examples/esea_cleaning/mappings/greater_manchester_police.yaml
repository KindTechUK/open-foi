  shape: event_log
  columns:
    ethnicity: "Crime Person Self Declared Ethnicity at Time of Crime : Ethnicity Description"
    year: "Crime Created on Date : Calendar Year "
    month: "Crime Created on Date : Month"
  null_ethnicity_label: "Not recorded"

