force_id: greater_manchester_police
display_name: Greater Manchester Police

source_file: "FOI.25.014831.T RESPONSE DATA.xlsx"

# 41,397 rows, one per crime. Columns already split year/month with month as
# a full-text English name ("January", "February" ...).
# ~10.5k rows have null ethnicity — relabelled "Not recorded" per FOI convention.
