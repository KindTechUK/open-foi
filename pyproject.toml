[project]
name = "open-foi"
dynamic = ["version"]
description = "CLI tool for searching, viewing, and fetching FOI requests from WhatDoTheyKnow.com"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "KindTech" },
]
keywords = ["foi", "freedom-of-information", "whatdotheyknow", "transparency", "open-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
clean = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "odfpy>=1.4",
    "PyYAML>=6.0",
    "pdf2image>=1.17",
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
foi = "foi_cli.cli:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/foi_cli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/foi_cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
